<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorro Eco - Sin conexión</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 16px; box-sizing: border-box; }
        .caja { background: #fff; max-width: 420px; padding: 32px; border-radius: 12px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,.1); }
        h1 { color: #2e7d32; margin: 0 0 10px; } p { color: #555; line-height: 1.5; }
        button { background: #000; color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Sin conexión</h1>
        <p>Ahorro Eco necesita internet para mostrar tu consumo y tus recomendaciones. Revisa tu conexión e inténtalo de nuevo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
